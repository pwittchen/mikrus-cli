[package]
name = "mikrus-cli"
version = "0.1.0"
edition = "2024"

[lib]
name = "mikrus_cli"
path = "src/lib.rs"

[[bin]]
name = "mikrus"
path = "src/main.rs"

[[bin]]
name = "mikrus-mcp"
path = "src/mcp/mikrus-mcp.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json"] }
rmcp = { version = "1.6", features = ["transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
mockito = "1"
